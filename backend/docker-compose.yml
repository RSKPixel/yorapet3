services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: ${API_PORT:-8009}
    ports:
      # Bound to localhost only; the public entry point is nginx.
      - "127.0.0.1:${API_PORT:-8009}:${API_PORT:-8009}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"API_PORT\"]}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
      API_PORT: ${API_PORT:-8009}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - ./deploy/nginx/40-enable-https.sh:/docker-entrypoint.d/40-enable-https.sh:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    # Reload every 12h so renewed certificates are picked up.
    command: ["/bin/sh", "-c", "(while sleep 12h; do /docker-entrypoint.d/40-enable-https.sh && nginx -s reload; done) & exec nginx -g 'daemon off;'"]

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  certbot-www:
  certbot-certs:
