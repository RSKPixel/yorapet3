services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      # Linux Docker has no host.docker.internal by default; map it to the host.
      - "host.docker.internal:host-gateway"
    environment:
      API_PORT: ${API_PORT:-8009}
    ports:
      # Localhost only; the server's nginx is the public entry point.
      - "127.0.0.1:${API_PORT:-8009}:${API_PORT:-8009}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"API_PORT\"]}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
