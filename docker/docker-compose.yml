name: yorapet3

services:
  api:
    build: ../backend
    container_name: yorapet3-api
    env_file:
      - .env
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8009}
    ports:
      - "${API_PORT:-8009}:${API_PORT:-8009}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"API_PORT\"]}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
